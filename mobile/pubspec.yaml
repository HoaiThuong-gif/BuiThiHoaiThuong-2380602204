name: nhombar
description: 'NhomBar — cùng con tạo thói quen sử dụng điện thoại lành mạnh.'
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  noise_meter: ^6.0.0
  permission_handler: ^13.0.2
  fl_chart: ^1.3.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
dev_dependencies:
  qr: ^3.0.2
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/english.json
